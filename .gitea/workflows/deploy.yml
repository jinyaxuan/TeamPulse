name: Deploy TeamPulse
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: docker
    steps:
      - name: Pull latest code
        run: |
          cd /opt/teampulse
          git pull origin main

      - name: Build Docker image
        run: |
          cd /opt/teampulse
          docker build -f apps/web/Dockerfile \
            --build-arg PUBLIC_APP_URL=https://teampulse.tangchaolizi.com \
            -t teampulse-web:latest .

      - name: Deploy
        run: |
          cd /opt/teampulse
          docker compose -f docker-compose.prod.yml up -d

      - name: Verify
        run: |
          sleep 5
          curl -sf http://localhost:3020/ > /dev/null && echo "Deploy OK" || echo "Deploy FAILED"
