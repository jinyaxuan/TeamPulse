<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pulse" x1="80" y1="256" x2="432" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Three person silhouettes (team) -->
  <circle cx="256" cy="150" r="36" fill="rgba(255,255,255,0.25)"/>
  <circle cx="160" cy="175" r="28" fill="rgba(255,255,255,0.18)"/>
  <circle cx="352" cy="175" r="28" fill="rgba(255,255,255,0.18)"/>
  <!-- Pulse/heartbeat line -->
  <polyline points="60,310 140,310 175,310 200,250 230,370 260,220 290,380 320,240 350,310 380,310 432,310"
    stroke="url(#pulse)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Bottom bar accent -->
  <rect x="140" y="410" width="232" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
</svg>
