services:
  postgres:
    image: postgres:15-alpine
    container_name: teampulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teampulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-teampulse}
    volumes:
      - teampulse-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teampulse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apply migrations on startup, then exit. App depends on this completing.
  # Uses the standalone image's bundled drizzle-orm + postgres-js to run the
  # migrator directly against the SQL files we shipped into apps/web/src/db/migrations.
  migrate:
    image: teampulse-web:latest
    working_dir: /app/apps/web
    entrypoint: ["/sbin/tini", "--"]
    command:
      - node
      - -e
      - |
        const postgres = require('postgres');
        const { drizzle } = require('drizzle-orm/postgres-js');
        const { migrate } = require('drizzle-orm/postgres-js/migrator');
        (async () => {
          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          await sql`CREATE EXTENSION IF NOT EXISTS citext`;
          await migrate(drizzle(sql), { migrationsFolder: 'src/db/migrations' });
          await sql.end();
          console.log('migrations applied');
        })().catch(e => { console.error(e); process.exit(1); });
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-teampulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-teampulse}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: teampulse-web:latest
    container_name: teampulse-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-teampulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-teampulse}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://teampulse.internal.company.com}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-teampulse_session}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: teampulse-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - teampulse-caddy-data:/data
      - teampulse-caddy-config:/config
    depends_on:
      - app

  # Nightly pg_dump to ./backups (mount outside to your NAS/backup target).
  backup:
    image: postgres:15-alpine
    container_name: teampulse-backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teampulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-teampulse}
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        while true; do
          sleep $((3600*24))   # run once a day
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          export PGPASSWORD="$$POSTGRES_PASSWORD"
          echo "[backup] dumping at $$TS"
          pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc \
            > "/backups/teampulse-$$TS.dump"
          find /backups -name 'teampulse-*.dump' -mtime +$${BACKUP_RETENTION_DAYS} -delete || true
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  teampulse-pg-data:
  teampulse-caddy-data:
  teampulse-caddy-config:
