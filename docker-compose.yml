# TeamPulse production stack - 192.168.100.246
# Uses shared infra-postgres for database
# For local dev, use: docker compose -f docker-compose.dev.yml up

services:
  migrate:
    image: teampulse-web:latest
    container_name: teampulse-migrate
    init: true
    working_dir: /app/apps/web
    command:
      - node
      - -e
      - |
        const postgres = require('postgres');
        const { drizzle } = require('drizzle-orm/postgres-js');
        const { migrate } = require('drizzle-orm/postgres-js/migrator');
        (async () => {
          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          await sql`CREATE EXTENSION IF NOT EXISTS citext`;
          await migrate(drizzle(sql), { migrationsFolder: 'src/db/migrations' });
          await sql.end();
          console.log('migrations applied');
        })().catch(e => { console.error(e); process.exit(1); });
    environment:
      - DATABASE_URL=postgresql://teampulse:Teampulse@2026@infra-postgres:5432/teampulse
    restart: "no"
    networks:
      - teampulse
      - infra-network

  app:
    image: teampulse-web:latest
    container_name: teampulse-web
    init: true
    environment:
      - DATABASE_URL=postgresql://teampulse:Teampulse@2026@infra-postgres:5432/teampulse
      - PUBLIC_APP_URL=https://teampulse.tangchaolizi.com
      - SESSION_COOKIE_NAME=teampulse_session
      - NODE_ENV=production
      - OIDC_ISSUER=https://casdoor.tangchaolizi.com
      - OIDC_CLIENT_ID=teampulse-oidc-client
      - OIDC_CLIENT_SECRET=teampulse-oidc-secret-2026
    ports:
      - "3020:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - teampulse
      - infra-network

networks:
  teampulse:
    driver: bridge
  infra-network:
    external: true
