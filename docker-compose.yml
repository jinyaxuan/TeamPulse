services:
  postgres:
    image: postgres:15-alpine
    container_name: teampulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: teampulse_dev_password
      POSTGRES_DB: teampulse
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # App and caddy are added later (once Next.js dockerfile exists).
  # For dev, run pnpm dev locally and use the postgres above.
